name: Daily X Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "10 14 * * *" # 7:10 AM MT
    - cron: "40 15 * * *" # 8:40 AM MT
    - cron: "10 18 * * *" # 11:10 AM MT
    - cron: "40 19 * * *" # 12:40 PM MT
    - cron: "10 22 * * *" # 3:10 PM MT
    - cron: "40 23 * * *" # 4:40 PM MT

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Pause guard (stop until Feb 12, 00:00 UTC)
        run: |
          PAUSE_UNTIL="2026-02-12T00:00:00Z"
          NOW_EPOCH=$(date -u +%s)
          PAUSE_EPOCH=$(date -u -d "$PAUSE_UNTIL" +%s)
          if [ "$NOW_EPOCH" -lt "$PAUSE_EPOCH" ]; then
            echo "PAUSED: Not running until $PAUSE_UNTIL (now=$(date -u))."
            exit 0
          fi
          echo "PAUSE OVER: Continuing (now=$(date -u))."

      - name: Checkout repo
        uses: actions/checkout@v4

      # Daily key so the cache can save updated state each day
      - name: Set cache date
        run: echo "CACHE_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Restore/save bot state cache
        uses: actions/cache@v4
        with:
          path: .bot_state
          key: bot-state-${{ github.repository }}-${{ github.ref_name }}-${{ env.CACHE_DATE }}
          restore-keys: |
            bot-state-${{ github.repository }}-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install tweepy google-genai google-auth pytz

      - name: Write Google credentials
        run: |
          cat > /tmp/gcp_key.json <<'EOF'
          ${{ secrets.GCP_SA_KEY_JSON }}
          EOF

      - name: Run reply-only bot
        run: python post_to_x.py
        env:
          # 🔒 Hard pause inside Python too (extra safety)
          PAUSE_UNTIL_UTC: "2026-02-12T00:00:00Z"

          TARGET_ACCOUNTS: "unusual_whales,CoinDesk,Cointelegraph,TheBlock__"

          # Bearer token for SEARCH
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

          # Google / Gemini (Vertex AI)
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_key.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: us-central1
          GOOGLE_GENAI_USE_VERTEXAI: "True"

          # X user auth for REPLY (OAuth 1.0a)
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
