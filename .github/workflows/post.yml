name: Daily X Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "10 14 * * *" # 7:10 AM MT
    - cron: "40 15 * * *" # 8:40 AM MT
    - cron: "10 18 * * *" # 11:10 AM MT
    - cron: "40 19 * * *" # 12:40 PM MT
    - cron: "10 22 * * *" # 3:10 PM MT
    - cron: "40 23 * * *" # 4:40 PM MT

concurrency:
  group: x-reply-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Restore cache using a stable key (NOT daily) so user_id_cache persists
      - name: Restore bot state cache
        uses: actions/cache@v4
        with:
          path: .bot_state
          key: bot-state-${{ github.repository }}-${{ github.ref_name }}-v3
          restore-keys: |
            bot-state-${{ github.repository }}-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install tweepy google-genai google-auth pytz

      - name: Debug - list repo files
        shell: bash
        run: |
          pwd
          ls -la

      - name: Write Google credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.GCP_SA_KEY_JSON }}' > /tmp/gcp_key.json
          python -c "import json; json.load(open('/tmp/gcp_key.json')); print('GCP JSON OK')"

      - name: Run reply-only bot
        shell: bash
        run: python post_to_x.py
        env:
          TARGET_ACCOUNTS: "unusual_whales,CoinDesk,Cointelegraph,TheBlock__"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_key.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: us-central1
          GOOGLE_GENAI_USE_VERTEXAI: "true"

          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
