name: Daily X Auto Post

on:
  workflow_dispatch:
  schedule:
    # 🌅 Morning (Mountain Time)
    - cron: "05 13 * * *" # 6:05 AM MT
    - cron: "25 13 * * *" # 6:25 AM MT
    - cron: "45 13 * * *" # 6:45 AM MT
    - cron: "10 14 * * *" # 7:10 AM MT
    - cron: "35 14 * * *" # 7:35 AM MT
    - cron: "00 15 * * *" # 8:00 AM MT
    - cron: "30 15 * * *" # 8:30 AM MT
    - cron: "15 16 * * *" # 9:15 AM MT

    # 🌤️ Afternoon (Mountain Time)
    - cron: "05 19 * * *" # 12:05 PM MT
    - cron: "35 19 * * *" # 12:35 PM MT
    - cron: "10 20 * * *" # 1:10 PM MT
    - cron: "40 20 * * *" # 1:40 PM MT
    - cron: "15 21 * * *" # 2:15 PM MT
    - cron: "45 21 * * *" # 2:45 PM MT
    - cron: "20 22 * * *" # 3:20 PM MT
    - cron: "50 22 * * *" # 3:50 PM MT

    # 🌆 Evening (Mountain Time)
    - cron: "05 0 * * *"  # 5:05 PM MT
    - cron: "35 0 * * *"  # 5:35 PM MT
    - cron: "10 1 * * *"  # 6:10 PM MT
    - cron: "40 1 * * *"  # 6:40 PM MT
    - cron: "15 2 * * *"  # 7:15 PM MT
    - cron: "45 2 * * *"  # 7:45 PM MT
    - cron: "20 3 * * *"  # 8:20 PM MT
    - cron: "50 3 * * *"  # 8:50 PM MT

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore bot state cache
        uses: actions/cache@v4
        with:
          path: .bot_state
          key: bot-state-${{ github.ref_name }}
          restore-keys: |
            bot-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install tweepy google-genai google-auth pytz

      - name: Write Google credentials
        run: |
          cat > /tmp/gcp_key.json <<'EOF'
          ${{ secrets.GCP_SA_KEY_JSON }}
          EOF

      - name: Run reply-only bot
        run: python post_to_x.py
        env:
          # 🔴 REQUIRED: accounts to reply to (comma-separated, no @)
          TARGET_ACCOUNTS: "unusual_whales,CoinDesk,Cointelegraph,WatcherGuru,TheBlock__"

          # Google / Gemini
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_key.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          GOOGLE_GENAI_USE_VERTEXAI: "True"

          # X API
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
