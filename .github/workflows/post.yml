name: Daily X Auto Post

on:
  workflow_dispatch:
  schedule:
#    - cron: "10 14 * * *" # 7:10 AM MT
#    - cron: "40 15 * * *" # 8:40 AM MT
#    - cron: "10 18 * * *" # 11:10 AM MT
#    - cron: "40 19 * * *" # 12:40 PM MT
#    - cron: "10 22 * * *" # 3:10 PM MT
#    - cron: "40 23 * * *" # 4:40 PM MT

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set cache date
        run: echo "CACHE_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Restore/save bot state cache
        uses: actions/cache@v4
        with:
          path: .bot_state
          key: bot-state-${{ github.repository }}-${{ github.ref_name }}-${{ env.CACHE_DATE }}
          restore-keys: |
            bot-state-${{ github.repository }}-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (pinned)
        run: |
          pip install --upgrade pip
          pip install "tweepy==4.14.0" google-genai google-auth pytz

      - name: Write Google credentials
        run: |
          cat > /tmp/gcp_key.json <<'EOF'
          ${{ secrets.GCP_SA_KEY_JSON }}
          EOF

      # ✅ Safe diagnostics (NO secret values printed)
      - name: Diagnostics (safe)
        run: |
          python - <<'PY'
          import os
          def s(name):
              v = os.getenv(name, "")
              print(f"{name}: present={bool(v)} len={len(v)}")
          for k in ["X_API_KEY","X_API_SECRET","X_ACCESS_TOKEN","X_ACCESS_SECRET","X_BEARER_TOKEN",
                    "GOOGLE_CLOUD_PROJECT","GOOGLE_CLOUD_LOCATION","GOOGLE_APPLICATION_CREDENTIALS",
                    "GOOGLE_GENAI_USE_VERTEXAI"]:
              s(k)
          PY
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_key.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: us-central1
          GOOGLE_GENAI_USE_VERTEXAI: "True"

      # ✅ ORIGINAL POSTS (no search endpoints) - uses OAuth1 v1.1 posting in your updated post_original.py
      - name: Run original post bot
        run: python post_original.py
        env:
          TIMEZONE: "US/Mountain"
          POST_RUN_CHANCE: "0.35"
          MAX_CHARS: "260"

          # Gemini / Vertex AI
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_key.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: us-central1
          GOOGLE_GENAI_USE_VERTEXAI: "True"

          # X user auth for posting
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      # ⛔ REPLIES (paused until Feb 12 reset)
      - name: Run reply-only bot (paused until Feb 12)
        run: python post_to_x.py
        env:
          PAUSE_UNTIL_UTC: "2026-02-12T00:00:00Z"

          TARGET_ACCOUNTS: "unusual_whales,CoinDesk,Cointelegraph,TheBlock__"

          # Bearer token for SEARCH (this is what is capped)
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

          # Gemini / Vertex AI
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_key.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: us-central1
          GOOGLE_GENAI_USE_VERTEXAI: "True"

          # X user auth for replying
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
